name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  lint:
    name: Lint with Biome CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@v2
      - run: biome ci ./src

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run type checks
        run: |
          pnpm --filter discord-player-googlevideo build
          pnpm --filter discord-bot tsc

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  build:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    name: Build image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xxczaki/discord-bot
      - name: Build and push by digest
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=ghcr.io/xxczaki/discord-bot,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
          provenance: mode=max
          sbom: true
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/xxczaki/discord-bot
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=,format=long
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | ("--tag", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotation_args < <(jq -r '.annotations[] | ("--annotation", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("ghcr.io/xxczaki/discord-bot@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${annotation_args[@]}" "${sources[@]}"
      - name: Inspect images
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for image in "ghcr.io/xxczaki/discord-bot:${VERSION}"; do
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools inspect "$image"; then
                continue 2
              fi
              echo "Inspect attempt ${attempt} for ${image} failed, retrying"
              sleep $((attempt * 3))
            done
            echo "::error::Could not inspect ${image} after 5 attempts"
            exit 1
          done
      - name: Resolve index digest
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/xxczaki/discord-bot:${VERSION}" --format '{{json .Manifest}}' | jq --raw-output .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/xxczaki/discord-bot
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  promote:
    needs: [merge]
    name: Deploy to homelab
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout homelab repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xxczaki/homelab
          persist-credentials: false
          path: homelab
      - name: Check deploy source
        id: source
        working-directory: homelab
        env:
          APPLICATION_FILE: apps/discord-bot/application.yaml
        run: |
          source_path=$(yq 'select(.kind == "Application") | .spec.source.path' "$APPLICATION_FILE")
          if [ "$source_path" != "deploy/chart" ]; then
            echo "::notice::Skipping homelab deploy: ${APPLICATION_FILE} uses source path '${source_path}', not 'deploy/chart'"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token
        if: steps.source.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: homelab
          permission-contents: write
      - name: Pin commit in Argo CD Application
        if: steps.source.outputs.enabled == 'true'
        uses: xxczaki/actions/commit-via-api@2055f70b487aac8d86315ce4eb26028931f60cd6 # v1.0.0
        env:
          APPLICATION_FILE: apps/discord-bot/application.yaml
          COMMIT_SHA: ${{ github.sha }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: xxczaki/homelab
          branch: main
          working-directory: homelab
          message: "chore(discord-bot): deploy ${{ github.sha }}"
          apply: |
            yq -i '
              (select(.kind == "Application") | .spec.source.targetRevision) = strenv(COMMIT_SHA) |
              (select(.kind == "Application") | .spec.source.helm.valuesObject.image.tag) = strenv(COMMIT_SHA)
            ' "$APPLICATION_FILE"
            git add "$APPLICATION_FILE"

  publish-chart:
    needs: [merge]
    name: Publish Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: discord-bot
      - name: Checkout charts repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xxczaki/charts
          persist-credentials: false
          fetch-tags: true
          path: charts-repo
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: charts
          permission-contents: write
      - name: Update and push chart
        uses: xxczaki/actions/commit-via-api@2055f70b487aac8d86315ce4eb26028931f60cd6 # v1.0.0
        env:
          SOURCE_CHART: ${{ github.workspace }}/discord-bot/deploy/chart/
          TARGET_CHART: charts/discord-bot
          COMMIT_SHA: ${{ github.sha }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: xxczaki/charts
          branch: main
          working-directory: charts-repo
          message: "chore: update discord-bot chart"
          apply: |
            git fetch --quiet --tags origin
            published_version=$(yq '.version' "$TARGET_CHART/Chart.yaml")
            latest_tag=$(git tag --list 'discord-bot-*' --sort=-version:refname | head -1)
            base_version=$(printf '%s\n' "${latest_tag#discord-bot-}" "$published_version" | grep -v '^$' | sort -V | tail -1)
            next_patch_version="${base_version%.*}.$((${base_version##*.} + 1))"
            source_version=$(yq '.version' "${SOURCE_CHART}Chart.yaml")
            NEXT_VERSION=$(printf '%s\n' "$next_patch_version" "$source_version" | sort -V | tail -1)
            export NEXT_VERSION

            rsync --archive --delete --exclude README.md "$SOURCE_CHART" "$TARGET_CHART/"
            yq -i '.image.tag = strenv(COMMIT_SHA)' "$TARGET_CHART/values.yaml"
            yq -i '.appVersion = strenv(COMMIT_SHA) | .version = strenv(NEXT_VERSION)' "$TARGET_CHART/Chart.yaml"
            git add --all "$TARGET_CHART"
