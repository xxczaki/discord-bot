packages:
  - packages/*
allowBuilds:
  '@biomejs/biome': true
  '@sentry/cli': true
  bufferutil: true
  esbuild: true
  zlib-sync: true

catalogMode: strict

dedupePeers: true

minimumReleaseAge: 1440

catalogs:
  default:
    '@biomejs/biome': 2.5.15
    '@types/node': ^24.19.2
    '@vitest/coverage-v8': ^5.0.5
    typescript: ^7.0.2
    vitest: ^5.0.5

enableGlobalVirtualStore: true

overrides:
  libsodium-wrappers: '-'

packageExtensions:
  discord-player:
    dependencies:
      '@discord-player/opus': '*'
      discord-api-types: '*'
      discord.js: '*'
      undici: '*'
  discord-player-spotify:
    peerDependencies:
      discord-player: '*'
  discord-voip:
    dependencies:
      '@discord-player/equalizer': '*'
      '@snazzah/davey': '*'
      discord-api-types: '*'
      ws: '*'
