packages:
  - packages/*
allowBuilds:
  '@biomejs/biome': true
  '@sentry/cli': true
  bufferutil: true
  esbuild: true
  zlib-sync: true

catalogMode: strict

dedupePeers: true

minimumReleaseAge: 1440

catalogs:
  default:
    '@biomejs/biome': 2.6.4
    '@types/node': ^26.6.6
    '@vitest/coverage-v8': ^5.1.0
    typescript: ^7.0.2
    vitest: ^5.1.0

enableGlobalVirtualStore: true

overrides:
  libsodium-wrappers: '-'

packageExtensions:
  discord-player:
    dependencies:
      '@discord-player/opus': '*'
      discord-api-types: '*'
      discord.js: '*'
      undici: '*'
  discord-player-spotify:
    peerDependencies:
      discord-player: '*'
  discord-voip:
    dependencies:
      '@discord-player/equalizer': '*'
      '@snazzah/davey': '^0.1.12'
      discord-api-types: '*'
      ws: '*'
patchedDependencies:
  '@discord-player/ffmpeg@7.2.0': patches/@discord-player__ffmpeg@7.2.0.patch
